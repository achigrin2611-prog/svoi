{% extends "base.html" %}

{% block content %}
<div class="login-screen">
    <div class="login-box">
        <h1 class="logo">Свои</h1>
        <p class="subtitle">Создать группу</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}
                        <p>{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('create_group') }}">
            <input type="text" name="group_name" placeholder="Название группы (например, Друзья)" required>
            <button type="submit">Создать</button>
            <p class="switch"><a href="{{ url_for('index') }}">← Назад к группам</a></p>
        </form>

        <p class="switch" style="margin-top: 16px; font-size: 12px; color: var(--text-dim);">
            После создания получишь код — скинь его друзьям
        </p>
    </div>
</div>
{% endblock %}
