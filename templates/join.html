{% extends "base.html" %}

{% block content %}
<div class="login-screen">
    <div class="login-box">
        <h1 class="logo">Свои</h1>
        <p class="subtitle">Войти в группу по коду</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}
                        <p>{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('join_group') }}">
            <input type="text" name="invite_code" placeholder="Код приглашения (SVOI-XXXX)" required>
            <button type="submit">Войти</button>
            <p class="switch"><a href="{{ url_for('index') }}">← Назад</a></p>
        </form>
    </div>
</div>
{% endblock %}
