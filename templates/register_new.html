{% extends "base.html" %}

{% block content %}
<div class="login-screen">
    <div class="login-box">
        <h1 class="logo">Свои</h1>
        <p class="subtitle">Создать группу</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}
                        <p>{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register_new') }}">
            <input type="text" name="group_name" placeholder="Название группы (например, Друзья)" required>
            <input type="text" name="username" placeholder="Твоё имя" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Создать группу</button>
            <p class="switch">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
        </form>
    </div>
</div>
{% endblock %}
